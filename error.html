<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shikimori — ошибка входа</title>
  <style>
    body { background:#15171c; color:#e8eaed; font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:24px; box-sizing:border-box; }
    .box { max-width:560px; text-align:center; }
    .err { color:#ff6b6b; }
    h1 { font-size:28px; margin:0 0 12px; }
    p { color:#aab0b8; }
  </style>
</head>
<body>
  <div class="box">
    <h1 class="err">Не удалось войти</h1>
    <p>Вернитесь к телевизору и попробуйте «Вход по QR-коду» ещё раз.</p>
    <p id="reason"></p>
  </div>
  <script>
    try {
      var reasons = {
        expired: 'QR-код устарел. Откройте вход на телевизоре заново.',
        no_sid: 'Ссылка неполная. Откройте вход на телевизоре заново.',
        no_code: 'Shikimori не вернул код авторизации.',
        token_exchange_failed: 'Не удалось обменять код на токен. Попробуйте ещё раз.',
        not_configured: 'OAuth-приложение Shikimori не настроено на сервере.',
        access_denied: 'Доступ не разрешён.'
      };
      var reason = new URLSearchParams(location.search).get('reason');
      if (reason && reasons[reason]) document.getElementById('reason').textContent = reasons[reason];
    } catch (e) {}
  </script>
</body>
</html>
